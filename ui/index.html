<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kmjHarness 대시보드</title>
<style>
  :root {
    --bg:#f7f6f3; --panel:#fff; --ink:#1f1d1a; --sub:#6f6a62; --faint:#9a968e; --line:#e6e2db; --soft:#f1eee8;
    --accent:#c2410c; --accent-ink:#fff; --accent-hover:#9a3412;
    --ok:#15803d; --okbg:#e8f5ec; --warn:#b45309; --warnbg:#fdf3e2; --err:#b91c1c; --errbg:#fdecec;
    --lv:#c2410c; --lvoff:#e4dfd6; --hover:#fbfaf8; --sel:#fff7ed; --drawer:#fffdf9; --nextbg:#fff1e8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#171614; --panel:#1f1e1b; --ink:#eceae6; --sub:#a5a19a; --faint:#6f6b64; --line:#33312d; --soft:#2a2825;
      --accent:#f97316; --accent-ink:#1a1100; --accent-hover:#fb923c;
      --ok:#4ade80; --okbg:#173322; --warn:#fbbf24; --warnbg:#3a2e12; --err:#f87171; --errbg:#3d1c1c;
      --lv:#f97316; --lvoff:#3a3732; --hover:#242320; --sel:#2e2419; --drawer:#1c1b18; --nextbg:#3a2516;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; }
  .tabs { display:flex; gap:4px; margin-left:12px; }
  .tabs button { border:0; background:none; padding:6px 12px; border-radius:6px; font:inherit; color:var(--sub); cursor:pointer; }
  .tabs button.on { background:var(--soft); color:var(--ink); font-weight:600; }
  .spacer { flex:1; }
  .ws { color:var(--sub); font-size:12px; font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  button.btn { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
  button.btn:hover { background:var(--soft); }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.primary:hover { background:var(--accent-hover); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  button.sm { padding:2px 8px; font-size:12px; }
  button.link { border:0; background:none; color:var(--accent); cursor:pointer; font:inherit; padding:0; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }

  /* 로딩 표시 */
  #bar { position:fixed; top:0; left:0; right:0; height:2px; z-index:20; overflow:hidden; pointer-events:none; opacity:0; transition:opacity .18s; }
  #bar.on { opacity:1; }
  #bar::after { content:''; position:absolute; inset:0 auto 0 0; width:38%; background:var(--accent); animation:slide 1.05s ease-in-out infinite; }
  @keyframes slide { 0%{left:-38%} 60%{left:100%} 100%{left:100%} }
  .spin { display:inline-block; width:11px; height:11px; vertical-align:-1px; border:2px solid currentColor; border-right-color:transparent; border-radius:99px; animation:rot .6s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg) } }
  .skel { display:inline-block; height:10px; width:160px; border-radius:4px; background:var(--soft); animation:pulse 1.3s ease-in-out infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* 레벨 카드 */
  .levels { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
  .lvc { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; }
  .lvc .h { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .lvc .id { font-weight:700; color:var(--accent); }
  .lvc .nm { font-weight:600; }
  .lvc .risk { margin-left:auto; font-size:11px; color:var(--sub); }
  .lvc p { margin:0; color:var(--sub); line-height:1.45; }
  .lvc.soon { opacity:.6; }
  @media (max-width:900px) { .levels { grid-template-columns:repeat(2,1fr); } }

  /* 요약 */
  .summary { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:150px; }
  .chip b { display:block; font-size:22px; line-height:1.2; }
  .chip span { color:var(--sub); font-size:12.5px; }
  .chip.err b { color:var(--err); } .chip.ok b { color:var(--ok); } .chip.warn b { color:var(--warn); }

  /* 레포 표 — 레포마다 tbody 하나 (줄 + 펼침) */
  table.repos { width:100%; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table.repos > thead th { white-space:nowrap; text-align:left; font-weight:600; font-size:12px; color:var(--sub); padding:10px 14px; background:var(--soft); border-bottom:1px solid var(--line); }
  table.repos > tbody > tr > td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.repos > tbody:last-of-type > tr:last-child > td { border-bottom:0; }
  tr.repo { cursor:pointer; }
  tr.repo:hover td { background:var(--hover); }
  tr.repo.sel td { background:var(--sel); }
  .name { font-weight:600; }
  .meta { color:var(--sub); font-size:12px; }
  .meta .running { color:var(--accent); font-weight:600; }
  .lv { display:flex; align-items:center; gap:6px; }
  .bar { display:flex; gap:2px; }
  .bar i { width:14px; height:8px; border-radius:2px; background:var(--lvoff); }
  .bar i.on { background:var(--lv); }
  .lv small { color:var(--sub); font-size:12px; min-width:36px; }
  .st { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; flex:none; }
  .st.ok { background:var(--okbg); color:var(--ok); } .st.err { background:var(--errbg); color:var(--err); }
  .st.warn { background:var(--warnbg); color:var(--warn); } .st.none { background:var(--soft); color:var(--sub); }
  .st.sm { width:18px; height:18px; font-size:11px; }
  .todo { display:flex; align-items:center; gap:8px; min-width:0; }
  .tag { font-size:11.5px; border-radius:4px; padding:1px 6px; font-weight:600; white-space:nowrap; }
  .tag.block { background:var(--errbg); color:var(--err); }
  .tag.do { background:var(--warnbg); color:var(--warn); }
  .tag.next { background:var(--nextbg); color:var(--accent); }
  .tag.done { background:var(--okbg); color:var(--ok); }
  td.act { text-align:right; white-space:nowrap; }
  .loadtxt { color:var(--faint); font-size:12.5px; }

  /* 좁은 화면 — 표 대신 카드. 가로 스크롤이 생기지 않게 한다 */
  @media (max-width:720px) {
    header { flex-wrap:wrap; gap:8px 12px; padding:10px 14px; }
    header .ws { order:3; flex-basis:100%; }
    .tabs { margin-left:0; }
    main { padding:14px 12px 40px; }
    .levels { grid-template-columns:1fr; }
    .chip { min-width:0; flex:1 1 calc(50% - 12px); }
    table.repos, table.repos > tbody, table.repos > tbody > tr.drawer, table.repos > tbody > tr.drawer > td { display:block; width:100%; }
    table.repos > thead { display:none; }
    table.repos > tbody > tr.repo { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px 10px; align-items:center;
                          padding:12px 14px; border-bottom:1px solid var(--line); }
    table.repos > tbody > tr.repo > td { display:block; padding:0; border:0; background:none !important; min-width:0; }
    tr.repo:hover, tr.repo.sel { background:var(--hover); }
    tr.repo.sel { background:var(--sel); }
    tr.repo td:nth-child(1) { grid-column:1 / 3; grid-row:1; }
    tr.repo td:nth-child(2) { grid-column:3; grid-row:1; }
    tr.repo td:nth-child(3) { grid-column:1; grid-row:2; }
    tr.repo td:nth-child(4) { grid-column:2 / 4; grid-row:2; }
    tr.repo td.act { grid-column:1 / 4; grid-row:3; text-align:left; }
    tr.repo td.act:empty { display:none; }
    .dr { padding:12px 14px 16px; }
    .files .row { flex-wrap:wrap; }
    .files .n { flex-basis:100%; padding-left:42px; }
  }

  /* 펼침 */
  tr.drawer > td { background:var(--drawer); padding:0; }
  .dr { padding:16px 20px 20px; display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }
  @media (max-width:820px) { .dr { grid-template-columns:1fr; } }
  .dr h3 { font-size:13px; margin:0 0 8px; }
  .group { margin-bottom:14px; }
  .group h4 { font-size:12px; color:var(--sub); margin:0 0 6px; font-weight:600; }
  .item { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-top:1px dashed var(--line); }
  .item:first-of-type { border-top:0; }
  .item .t { flex:1; min-width:0; }
  .f { color:var(--sub); font-size:12px; }
  .lvh { margin:6px 0 2px; font-size:12px; font-weight:600; }
  details summary { cursor:pointer; color:var(--sub); font-size:12.5px; }
  details[open] summary { margin-bottom:6px; }
  .steps { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:12px 14px; }
  .steps ol { margin:0; padding:0; list-style:none; }
  .steps li { display:flex; gap:8px; align-items:center; padding:5px 0; }
  .steps li .s { width:18px; text-align:center; }
  .steps li.now { font-weight:600; }
  .steps li.wait, .steps li.skip { color:var(--sub); }
  .dim { color:var(--sub); }
  .side p { font-size:12px; margin:8px 0 0; }
  .side .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  code { font-family:var(--mono); font-size:11.5px; background:var(--soft); padding:1px 5px; border-radius:4px; }

  table.tc { width:100%; border-collapse:collapse; font-size:12px; margin-top:4px; }
  table.tc th { text-align:left; font-weight:600; color:var(--faint); font-size:11px; padding:0 8px 4px 0; border-bottom:1px solid var(--line); }
  table.tc td { padding:4px 8px 4px 0; border-bottom:1px solid var(--line); }
  table.tc td.v { font-family:var(--mono); font-size:11.5px; }
  .vs { font-size:11px; font-weight:600; }
  .vs.ok { color:var(--ok); } .vs.behind { color:var(--warn); } .vs.missing { color:var(--err); } .vs.ahead,.vs.extra,.vs.unknown { color:var(--faint); }

  /* 제외한 폴더 */
  .excl { margin-top:12px; color:var(--sub); font-size:12.5px; }
  .excl ul { margin:6px 0 0; padding-left:18px; }
  .excl li { padding:2px 0; }

  /* 적용 대화상자 */
  dialog { border:0; border-radius:12px; padding:0; width:min(600px,92vw); background:var(--panel); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(20,18,15,.35); }
  .dh { padding:16px 20px; border-bottom:1px solid var(--line); }
  .dh h2 { margin:0; font-size:16px; }
  .dh p { margin:4px 0 0; color:var(--sub); font-size:13px; }
  .db { padding:14px 20px; max-height:56vh; overflow:auto; }
  .files { margin:0; padding:0; list-style:none; font-family:var(--mono); font-size:12.5px; }
  .files li { padding:3px 0; }
  .files .row { display:flex; gap:8px; cursor:pointer; align-items:baseline; }
  .files .row:hover .p { text-decoration:underline; }
  .files .k { width:34px; flex:none; font-weight:700; }
  .files .n { font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; font-size:12px; }
  .k.c { color:var(--ok); } .k.m { color:var(--warn); } .k.d { color:var(--err); } .k.s { color:var(--sub); }
  .files pre, pre.log { margin:6px 0 8px; padding:10px 12px; font-family:var(--mono); font-size:11.5px; line-height:1.5; background:var(--bg); border:1px solid var(--line); border-radius:6px; max-height:240px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .notes { margin:10px 0 0; padding:8px 12px; border-radius:6px; background:var(--warnbg); color:var(--warn); font-size:12.5px; }
  .notes.err { background:var(--errbg); color:var(--err); }
  .run { margin:12px 0 0; border-top:1px solid var(--line); padding:12px 0 0; }
  .run li { list-style:none; padding:4px 0; display:flex; gap:8px; align-items:baseline; }
  .run li .m { width:18px; flex:none; text-align:center; }
  .run li.ok .m { color:var(--ok); } .run li.fail .m { color:var(--err); } .run li.skip { color:var(--sub); }
  .run li .x { color:var(--sub); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .df { padding:12px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .df .msg { margin-right:auto; font-size:12.5px; color:var(--sub); }
  .df .msg.warn { color:var(--warn); } .df .msg.err { color:var(--err); } .df .msg.ok { color:var(--ok); }

  /* 설명서 */
  .guide { display:grid; grid-template-columns:180px 1fr; gap:24px; }
  .guide nav { position:sticky; top:76px; align-self:start; }
  .guide nav a { display:block; padding:5px 8px; border-radius:6px; color:var(--sub); text-decoration:none; font-size:12.5px; }
  .guide nav a:hover { background:var(--soft); color:var(--ink); }
  @media (max-width:760px) { .guide { grid-template-columns:1fr; } .guide nav { display:none; } }
  .doc { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 26px 30px; min-width:0; }
  .doc h3 { font-size:15px; margin:24px 0 8px; scroll-margin-top:80px; }
  .doc p { margin:0 0 10px; color:var(--sub); font-size:13px; line-height:1.65; }
  .doc ul { margin:0 0 12px; padding-left:20px; color:var(--sub); font-size:13px; line-height:1.7; }
  .doc strong { color:var(--ink); }
  .doc h4 { font-size:13px; margin:20px 0 6px; }
  .doc table.tc { font-size:12.5px; margin-bottom:14px; }
  .doc table.tc td { padding:6px 10px 6px 0; }
  .lvcard { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .lvcard .top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .lvcard .id { font-family:var(--mono); font-weight:700; color:var(--accent); }
  .lvcard .nm { font-weight:650; }
  .lvcard .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px; }
  @media (max-width:700px) { .lvcard .cols { grid-template-columns:1fr; } }
  .lvcard h5 { margin:0 0 4px; font-size:11px; color:var(--faint); }
  .risk { font-size:11px; font-weight:650; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .risk.none,.risk.low { color:var(--ok); } .risk.medium { color:var(--warn); } .risk.high { color:var(--err); }
  .soonchip { font-size:11.5px; color:var(--faint); border:1px dashed var(--line); padding:2px 9px; border-radius:99px; }
  .cmdrow { border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin:9px 0; }
  .cmdrow code { font-size:12.5px; font-weight:650; background:none; padding:0; }
  .cmddesc { color:var(--sub); font-size:12.5px; margin:3px 0 7px; }
  .cmdex { margin:0; padding:9px 11px; background:var(--ink); color:var(--bg); border-radius:7px; font-family:var(--mono); font-size:11.5px; line-height:1.6; white-space:pre-wrap; }
  .note { border-left:3px solid var(--accent); padding:2px 0 2px 12px; margin:8px 0; font-size:12.5px; color:var(--sub); }
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <h1>kmjHarness</h1>
  <div class="tabs" role="tablist">
    <button class="on" data-tab="board" role="tab">현황</button>
    <button data-tab="guide" role="tab">설명서</button>
  </div>
  <span class="spacer"></span>
  <span class="ws" id="ws"></span>
  <button class="btn" id="refresh">새로고침</button>
</header>

<main>
  <section id="board">
    <div class="levels" id="levels"></div>
    <div class="summary" id="summary"></div>
    <table class="repos" id="repos">
      <thead><tr><th style="width:24%">레포</th><th style="width:16%">레벨</th><th style="width:6%">상태</th><th>지금 할 일</th><th style="width:14%"></th></tr></thead>
      <tbody class="msg"><tr><td colspan="5" class="loadtxt"><span class="spin"></span> 레포 목록을 읽는 중…</td></tr></tbody>
    </table>
    <div class="excl" id="excl"></div>
  </section>

  <section id="guide" class="guide" hidden>
    <nav>
      <a href="#d-what">이게 뭔가</a>
      <a href="#d-rules">4가지 원칙</a>
      <a href="#d-std">표준 버전</a>
      <a href="#d-levels">편입 레벨 L0~L4</a>
      <a href="#d-order">작업 순서</a>
      <a href="#d-cmd">명령어</a>
      <a href="#d-own">파일 소유권</a>
      <a href="#d-terms">용어</a>
      <a href="#d-faq">자주 겪는 상황</a>
    </nav>
    <div class="doc" id="docBody"></div>
  </section>
</main>

<dialog id="dlg">
  <div class="dh"><h2 id="dT"></h2><p id="dS"></p></div>
  <div class="db">
    <div id="dBody"></div>
    <ol class="run" id="dRun" hidden></ol>
    <div id="dLog"></div>
  </div>
  <div class="df">
    <span class="msg" id="dNote"></span>
    <button class="btn" id="dClose">닫기</button>
    <button class="btn primary" id="dGo">적용하고 확인</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
// HTML 에 넣는 모든 문자열은 이걸 거친다 (속성값에도 쓰므로 따옴표까지)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

let META = null;            // /api/meta — 레벨 정의 · 표준 버전
let LIST = [];              // /api/repos — 빠른 목록
const DETAIL = {};          // name → /api/repo 결과 (또는 { error })
let OPEN = null;            // 펼친 레포
let SHOW_EXCL = false;
let GEN = 0;                // 새로고침 세대 — 이전 세대의 늦은 응답은 버린다

// 진행 중인 요청 수를 세어 상단 바를 켜고 끈다
let busy = 0;
async function req(url, opts) {
  busy++; $('#bar').classList.add('on');
  try {
    const res = await fetch(url, opts);
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.error || `HTTP ${res.status}`);
    return body;
  } finally { if (--busy === 0) $('#bar').classList.remove('on'); }
}
const post = (url, body) => req(url, { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) });
const getDetail = (name) => req(`/api/repo?name=${encodeURIComponent(name)}`);

const RISK_KO = { none:'위험 없음', low:'낮음', medium:'중간', high:'높음' };
const TAG = { block:['block','막힘'], do:['do','먼저'], next:['next','다음 단계'], done:['done','완료'] };
const DOT = { block:['err','!'], do:['warn','•'], next:['none','○'], done:['ok','✓'] };
const BTN = { install:'설치', sync:'다시 적용', promote:'다음 단계', verify:'다시 확인' };
const ORDER = { block:0, do:1, next:2, done:3 };
const pmOf = (r) => (r.packageManager === 'none' ? 'npm' : r.packageManager);
const shown = () => LIST.filter((r) => !r.excluded);
const tbodyOf = (name) => [...document.querySelectorAll('#repos tbody[data-name]')].find((t) => t.dataset.name === name);

// ── 불러오기 ─────────────────────────────────────────────────
async function load() {
  const gen = ++GEN;
  const btn = $('#refresh');
  btn.disabled = true;
  try {
    const [meta, list] = await Promise.all([META ? Promise.resolve(META) : req('/api/meta'), req('/api/repos')]);
    if (gen !== GEN) return;
    META = meta; LIST = list.repos;
    $('#ws').textContent = list.workspaceRoot; $('#ws').title = list.workspaceRoot;
    for (const k of Object.keys(DETAIL)) delete DETAIL[k];
    renderLevels(); renderAllRows(); renderSummary(); renderExcl();
    if (!document.getElementById('docBody').innerHTML) renderGuide();
    await fetchDetails(shown().map((r) => r.name), gen);
    if (gen === GEN) sortRows();
  } catch (e) {
    $('#repos').querySelectorAll('tbody').forEach((t) => t.remove());
    $('#repos').insertAdjacentHTML('beforeend', `<tbody class="msg"><tr><td colspan="5" class="loadtxt">서버에 연결하지 못했습니다 — 터미널에서 대시보드가 실행 중인지 확인하세요. (${esc(e.message)})</td></tr></tbody>`);
  } finally {
    if (gen === GEN) btn.disabled = false;
  }
}

// 상세는 동시에 3개씩만 — 레포마다 git status 를 돌리므로 한꺼번에 부르면 오히려 느리다
async function fetchDetails(names, gen) {
  const queue = [...names];
  const worker = async () => {
    while (queue.length) {
      const name = queue.shift();
      try { const d = await getDetail(name); if (gen !== GEN) return; DETAIL[name] = d; syncListFrom(d); }
      catch (e) { if (gen !== GEN) return; DETAIL[name] = { error: e.message }; }
      renderRow(name); renderSummary(); watchJob(name);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

// 상세에서 바뀐 레벨 등을 목록에도 반영 (적용 직후)
function syncListFrom(d) {
  const r = LIST.find((x) => x.name === d.name);
  if (!r) return;
  Object.assign(r, { level: d.level, profile: d.profile, detectedProfile: d.detectedProfile, addons: d.detectedAddons,
    packageManager: d.packageManager, handshake: d.handshake, excluded: d.excluded });
}

async function refreshRepo(name) {
  try { const d = await getDetail(name); DETAIL[name] = d; syncListFrom(d); }
  catch (e) { DETAIL[name] = { error: e.message }; }
  renderRow(name); renderSummary();
  watchJob(name);
}

// 이 페이지 밖에서 시작됐거나(새로고침 전) 이미 돌고 있는 작업은 끝날 때까지 가끔 다시 본다.
// 레포마다 타이머는 하나만 — '다시 시도'나 새로고침을 여러 번 눌러도 겹치지 않는다.
const POLLERS = new Map();
function watchJob(name) {
  if (POLLERS.has(name) || RUNNING.has(name) || DETAIL[name]?.job?.status !== 'running') return;
  POLLERS.set(name, setTimeout(async () => {
    POLLERS.delete(name);
    await refreshRepo(name);
    if (!POLLERS.has(name)) sortRows();
  }, 2000));
}

// ── 현황: 레벨 카드 · 요약 ───────────────────────────────────
function renderLevels() {
  $('#levels').innerHTML = META.levels.map((l) => `<div class="lvc ${l.implemented ? '' : 'soon'}">
    <div class="h"><span class="id">L${l.id}</span><span class="nm">${esc(l.label ?? l.name)}</span><span class="risk">${esc(RISK_KO[l.risk] ?? l.risk)}</span></div>
    <p>${esc(l.short ?? l.summary)}</p></div>`).join('');
}

function renderSummary() {
  const list = shown();
  const managed = list.filter((r) => r.level != null).length;
  const loaded = list.filter((r) => DETAIL[r.name]?.nowTask);
  const pending = list.length - loaded.length;
  const count = (k) => loaded.filter((r) => DETAIL[r.name].nowTask.kind === k).length;
  const n = (k) => (pending ? `${count(k)}<small class="dim" style="font-size:12px;font-weight:400"> +확인 중 ${pending}</small>` : count(k));
  $('#summary').innerHTML = `
    <div class="chip"><b>${managed} / ${list.length}</b><span>하네스 관리 중</span></div>
    <div class="chip ok"><b>${n('done')}</b><span>할 일 없음</span></div>
    <div class="chip warn"><b>${n('do')}</b><span>먼저 할 일 있음</span></div>
    <div class="chip err"><b>${n('block')}</b><span>막힘 — 직접 손봐야 함</span></div>`;
}

// ── 현황: 표 ─────────────────────────────────────────────────
function renderAllRows() {
  const table = $('#repos');
  table.querySelectorAll('tbody').forEach((t) => t.remove());
  const list = shown();
  if (!list.length) {
    table.insertAdjacentHTML('beforeend', `<tbody class="msg"><tr><td colspan="5" class="loadtxt">${LIST.length ? '모든 폴더를 제외했습니다.' : '워크스페이스에 레포가 없습니다. kmjHarness 를 관리할 레포들과 같은 폴더에 두세요.'}</td></tr></tbody>`);
    return;
  }
  table.insertAdjacentHTML('beforeend', list.map((r) => `<tbody data-name="${esc(r.name)}">${rowHtml(r)}</tbody>`).join(''));
}

// 줄을 새로 그려도 펼쳐 둔 접힘 부분(<details data-k>)은 그대로 둔다
function renderRow(name) {
  const t = tbodyOf(name), r = LIST.find((x) => x.name === name);
  if (!t || !r) return;
  const open = new Set([...t.querySelectorAll('details[data-k][open]')].map((d) => d.dataset.k));
  t.innerHTML = rowHtml(r);
  for (const d of t.querySelectorAll('details[data-k]')) if (open.has(d.dataset.k)) d.open = true;
}

// 모든 상세가 도착하면 한 번만 정렬한다 (도착할 때마다 줄이 움직이면 읽기 어렵다)
function sortRows() {
  const key = (name) => ORDER[DETAIL[name]?.nowTask?.kind] ?? 9;
  const bodies = [...document.querySelectorAll('#repos tbody[data-name]')];
  bodies.sort((a, b) => key(a.dataset.name) - key(b.dataset.name) || a.dataset.name.localeCompare(b.dataset.name));
  bodies.forEach((b) => $('#repos').appendChild(b));
}

function levelBar(level) {
  const lv = level ?? -1;
  return `<div class="lv"><span class="bar">${[0, 1, 2, 3, 4].map((i) => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span>
    <small>${level == null ? '미편입' : 'L' + level}</small></div>`;
}

function rowHtml(r) {
  const d = DETAIL[r.name];
  const t = d?.nowTask;
  const running = d?.job?.status === 'running' || RUNNING.has(r.name);
  const meta = [`${esc(r.profile)}${r.addons?.length ? ' +' + esc(r.addons.join(',')) : ''}`, esc(r.packageManager)];
  if (d?.branch) meta.push(esc(d.branch));
  if (running) meta.push(`<span class="running">${d?.job?.script === 'install' ? '설치' : '실행'} 중</span>`);

  let status, todo, act = '';
  if (!d) {
    status = '<span class="st none"><span class="spin" style="width:9px;height:9px"></span></span>';
    todo = '<span class="skel"></span>';
  } else if (d.error) {
    status = '<span class="st none">?</span>';
    todo = `<span class="loadtxt">상태를 읽지 못했습니다 — ${esc(d.error)}</span>`;
    act = `<button class="btn sm" data-act="retry">다시 시도</button>`;
  } else {
    const [cls, mark] = DOT[t.kind];
    status = `<span class="st ${cls}" title="${esc(TAG[t.kind][1])}">${mark}</span>`;
    todo = `<div class="todo"><span class="tag ${TAG[t.kind][0]}">${TAG[t.kind][1]}</span>${esc(t.text)}</div>`;
    if (t.action) {
      act = `<button class="btn ${t.action === 'promote' ? 'primary' : ''}" data-act="go" ${running ? 'disabled' : ''}>${running ? '실행 중' : BTN[t.action]}</button>`;
    }
  }
  const main = `<tr class="repo ${OPEN === r.name ? 'sel' : ''}" data-act="toggle">
    <td><div class="name">${esc(r.name)}</div><div class="meta">${meta.join(' · ')}</div></td>
    <td>${levelBar(r.level)}</td>
    <td>${status}</td>
    <td>${todo}</td>
    <td class="act">${act}</td></tr>`;
  return main + (OPEN === r.name ? drawerHtml(r, d) : '');
}

// ── 펼침 ─────────────────────────────────────────────────────
const SEV = { error:['err','!'], warn:['warn','•'], info:['none','i'] };
const itemHtml = (f) => `<div class="item"><span class="st sm ${SEV[f.severity][0]}">${SEV[f.severity][1]}</span>
  <div class="t" title="${esc(f.detail || '')}">${esc(f.title)}${f.fix ? `<div class="f">→ ${esc(f.fix)}</div>` : ''}</div></div>`;
const VS_KO = { ok:'일치', behind:'뒤처짐', ahead:'앞섬', missing:'없음', extra:'표준 미정', unknown:'판별 불가' };

function drawerHtml(r, d) {
  if (!d) return `<tr class="drawer"><td colspan="5"><div class="dr"><div class="loadtxt"><span class="spin"></span> 상태를 읽는 중…</div></div></td></tr>`;
  if (d.error) return `<tr class="drawer"><td colspan="5"><div class="dr"><div class="loadtxt">상태를 읽지 못했습니다.</div></div></td></tr>`;

  const lv = d.level ?? -1, t = d.nowTask, g = d.git || {};
  const fs = d.diagnosis.findings;
  // 지금 할 일: 오류·경고와 미커밋 / 나중에: 레벨을 올리면 해결되는 예고 / 참고: 나머지 정보
  const now = fs.filter((f) => f.severity !== 'info' || f.id === 'dirty');
  const later = fs.filter((f) => f.severity === 'info' && f.id !== 'dirty' && f.sinceLevel > lv && f.sinceLevel >= 1);
  const note = fs.filter((f) => !now.includes(f) && !later.includes(f));
  const byLevel = {};
  for (const f of later) (byLevel[f.sinceLevel] ??= []).push(f);
  const lvName = (id) => META.levels.find((l) => l.id === Number(id));

  // 순서 목록은 서버(core/steps.js 의 orderSteps)가 nowTask 와 같은 데이터로 만든다
  const MARK = { done:'✓', now:'→', wait:'○', skip:'–' };
  const cur = d.level != null ? lvName(d.level) : null;
  const tcRows = d.toolchain || [];
  const off = tcRows.filter((x) => x.status === 'behind' || x.status === 'missing').length;

  return `<tr class="drawer"><td colspan="5"><div class="dr">
    <div>
      <div class="group"><h4>지금 할 일</h4>${now.length ? now.map(itemHtml).join('') : '<div class="dim">없음</div>'}
        ${t.why ? `<div class="f" style="margin-top:6px">${esc(t.why)}</div>` : ''}</div>
      ${later.length ? `<div class="group"><details data-k="later"><summary>나중에 — 레벨을 올리면 저절로 해결되는 것 ${later.length}개</summary>
        ${Object.entries(byLevel).map(([l, list]) => `<div class="lvh">L${esc(l)}에서${lvName(l)?.implemented ? '' : ' (준비 중)'}</div>${list.map(itemHtml).join('')}`).join('')}</details></div>` : ''}
      ${note.length ? `<div class="group"><details data-k="note"><summary>참고 ${note.length}개</summary>${note.map(itemHtml).join('')}</details></div>` : ''}
    </div>
    <div class="side"><h3>순서</h3><div class="steps"><ol>${(d.order || []).map((o) => `<li class="${esc(o.state)}"><span class="s">${MARK[o.state] ?? '○'}</span>${esc(o.label)}</li>`).join('')}</ol></div>
      ${cur ? `<p class="dim">지금 L${cur.id} ${esc(cur.label ?? cur.name)} — ${esc(cur.short ?? cur.summary)}</p>` : ''}
      <p class="dim">${esc(d.branch || '브랜치 없음')}${d.lastCommit ? ' · ' + esc(d.lastCommit) : ''}${g.eolNoise ? ` · 줄바꿈 차이만 있는 파일 ${g.eolNoise}개` : ''}</p>
      ${tcRows.length ? `<details data-k="versions" style="margin-top:8px"><summary>버전 비교 — ${off ? `${off}개가 표준과 다름` : '모두 표준과 같음'}</summary>
        <table class="tc"><thead><tr><th>패키지</th><th>현재</th><th>표준</th><th></th></tr></thead><tbody>
        ${tcRows.map((x) => `<tr><td>${esc(x.name)}</td><td class="v">${esc(x.current ?? '—')}</td><td class="v">${esc(x.standard ?? '—')}</td><td><span class="vs ${esc(x.status)}">${esc(VS_KO[x.status] ?? x.status)}</span></td></tr>`).join('')}
        </tbody></table></details>` : ''}
      <div class="acts">
        ${d.scripts?.verify ? `<button class="btn sm" data-act="verify">verify 실행</button>` : ''}
        ${d.level == null ? `<button class="btn sm" data-act="exclude" title="이 머신에서만 목록에서 뺍니다 (workspace.json)">이 폴더 제외</button>` : ''}
        <span class="dim" style="font-size:12px">파일 단위로 보기: <code>kmjh plan ${esc(r.name)}</code></span>
      </div>
    </div>
  </div></td></tr>`;
}

// ── 제외한 폴더 ─────────────────────────────────────────────
function renderExcl() {
  const ex = LIST.filter((r) => r.excluded);
  $('#excl').innerHTML = ex.length ? `제외한 폴더 ${ex.length}개
    <button class="link" data-act="excl-toggle">${SHOW_EXCL ? '숨기기' : '보기'}</button>
    ${SHOW_EXCL ? `<ul>${ex.map((r) => `<li>${esc(r.name)} <button class="link" data-act="include" data-name="${esc(r.name)}">다시 넣기</button></li>`).join('')}</ul>` : ''}` : '';
}

async function setExcluded(name, excluded) {
  try { await post('/api/exclude', { name, excluded }); }
  catch (e) { alert(`바꾸지 못했습니다 — ${e.message}`); return; }
  const r = LIST.find((x) => x.name === name);
  if (r) r.excluded = excluded;
  if (excluded && OPEN === name) OPEN = null;
  renderAllRows(); renderSummary(); renderExcl(); sortRows();
  if (!excluded && !DETAIL[name]) { await fetchDetails([name], GEN); sortRows(); }
}

// ── 이벤트 (위임) ───────────────────────────────────────────
$('#repos').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  const body = e.target.closest('tbody[data-name]');
  if (!el || !body) return;
  const name = body.dataset.name;
  const act = el.dataset.act;
  if (act === 'toggle') {
    if (e.target.closest('tr.drawer')) return;
    const prev = OPEN; OPEN = OPEN === name ? null : name;
    if (prev && prev !== name) renderRow(prev);
    renderRow(name);
    return;
  }
  e.stopPropagation();
  if (act === 'go') openFlow(name, DETAIL[name].nowTask.action);
  else if (act === 'verify') openFlow(name, 'verify');
  else if (act === 'exclude') setExcluded(name, true);
  else if (act === 'retry') { delete DETAIL[name]; renderRow(name); refreshRepo(name); }
});
$('#excl').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'excl-toggle') { SHOW_EXCL = !SHOW_EXCL; renderExcl(); }
  if (el.dataset.act === 'include') setExcluded(el.dataset.name, false);
});
$('#refresh').addEventListener('click', load);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('#board').hidden = b.dataset.tab !== 'board';
  $('#guide').hidden = b.dataset.tab !== 'guide';
}));

// ── 적용 흐름: 미리보기 → [적용하고 확인] → 적용 · 설치 · 검증 ────────
const dlg = $('#dlg');
const RUNNING = new Set();         // 흐름이 진행 중인 레포
let FLOW = null;                   // 지금 대화상자가 보여주는 흐름

$('#dClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('close', () => { FLOW = null; });

const KIND_KO = { create:['c','생성'], update:['m','수정'], merge:['m','수정'], delete:['d','삭제'] };

async function openFlow(name, mode) {
  const r = LIST.find((x) => x.name === name), d = DETAIL[name];
  if (!r || !d || d.error) return;
  const t = d.nowTask;
  const level = mode === 'sync' ? d.level : mode === 'promote' ? t.toLevel : null;
  const flow = FLOW = { name, mode, level, plan: null };
  const pm = pmOf(d);

  $('#dT').textContent = mode === 'install' ? `${name} — 의존성 설치`
    : mode === 'verify' ? `${name} — verify 실행`
    : mode === 'sync' ? `${name} — 표준 다시 적용 (L${level})` : `${name} — L${level}로`;
  $('#dS').textContent = mode === 'install' ? `${pm} install 을 실행합니다. 소스 파일은 바뀌지 않습니다.`
    : mode === 'verify' ? `${pm === 'npm' ? 'npm run verify' : pm + ' verify'} 를 실행합니다. 파일은 바뀌지 않습니다.`
    : d.hasPackageJson ? '아래 파일이 바뀝니다. 적용 뒤 install 과 verify 를 이어서 돌립니다.' : '아래 파일이 바뀝니다.';
  $('#dBody').innerHTML = ''; $('#dLog').innerHTML = '';
  const run = $('#dRun'); run.hidden = true; run.innerHTML = '';
  const go = $('#dGo'); go.hidden = false; go.disabled = true;
  go.textContent = mode === 'install' ? '설치' : mode === 'verify' ? '실행' : '적용하고 확인';
  setNote('');
  dlg.showModal();

  // 막힘 — 병합 중인 레포에는 아무것도 하지 않는다
  if (d.git?.inMerge && (mode === 'promote' || mode === 'sync')) {
    setNote(`머지 충돌 ${d.git.conflicted}개 — 해결하기 전에는 적용할 수 없습니다`, 'err');
    return;
  }

  if (mode === 'promote' || mode === 'sync') {
    $('#dBody').innerHTML = '<div class="loadtxt"><span class="spin"></span> 바뀔 파일을 계산하는 중…</div>';
    let plan;
    try { plan = await post('/api/plan', { repo: name, level }); }
    catch (e) { if (FLOW === flow) $('#dBody').innerHTML = `<div class="notes err">계획을 가져오지 못했습니다 — ${esc(e.message)}</div>`; return; }
    if (FLOW !== flow) return;
    if (plan.unavailable) { $('#dBody').innerHTML = `<div class="notes">${esc(plan.reason)}</div>`; return; }
    flow.plan = plan;
    $('#dBody').innerHTML = planHtml(plan);
  }

  const dirty = d.git?.dirty || 0;
  if ((mode === 'promote' || mode === 'sync') && dirty) setNote(`커밋 안 된 변경 ${dirty}건이 있습니다 — 먼저 커밋을 권합니다`, 'warn');
  go.disabled = RUNNING.has(name) || d.job?.status === 'running';
  if (go.disabled) setNote('이 레포에서 이미 작업이 실행 중입니다');
  go.onclick = () => runFlow(flow);
}

function planHtml(plan) {
  const changed = plan.actions.filter((a) => a.kind !== 'skip');
  const same = plan.actions.filter((a) => a.kind === 'skip');
  // 설치는 이 흐름이 이어서 하므로 "다시 설치하세요" 안내는 뺀다
  const warns = (plan.warnings || []).filter((w) => !w.includes('다시 설치'));
  return `${changed.length ? `<ul class="files">${changed.map((a, i) => {
      const [k, ko] = KIND_KO[a.kind] || ['m', a.kind];
      const body = a.remove ? '이 파일이 삭제됩니다. 현재 내용:\n\n' + (a.before ?? '') : (a.after ?? '');
      return `<li><div class="row" data-i="${i}"><span class="k ${k}">${ko}</span><span class="p">${esc(a.rel)}</span><span class="n dim">${esc(a.note || '')}</span></div>
        <pre hidden>${esc(body)}</pre></li>`;
    }).join('')}</ul>` : '<div class="dim">바뀔 파일이 없습니다 — 이미 표준과 같습니다.</div>'}
    ${same.length ? `<details style="margin-top:8px"><summary>이미 동일함 ${same.length}개</summary>
      <ul class="files">${same.map((a) => `<li><span class="k s">그대로</span> ${esc(a.rel)}</li>`).join('')}</ul></details>` : ''}
    ${warns.length ? `<div class="notes">${warns.map(esc).join('<br>')}</div>` : ''}
    <div class="f" style="margin-top:8px">파일 이름을 누르면 적용될 내용을 볼 수 있습니다.</div>`;
}
$('#dBody').addEventListener('click', (e) => {
  const row = e.target.closest('.files .row');
  if (row) { const pre = row.parentElement.querySelector('pre'); pre.hidden = !pre.hidden; }
});

function setNote(text, cls = '') { const n = $('#dNote'); n.textContent = text; n.className = 'msg ' + cls; }

// 흐름의 단계 표시. 대화상자를 닫아도 흐름은 계속되고, 끝나면 그 줄이 새로 고쳐진다.
function paintSteps(flow) {
  if (FLOW !== flow) return;
  const run = $('#dRun'); run.hidden = false;
  const M = { wait:'○', run:'⏳', ok:'✓', fail:'✗', skip:'–' };
  run.innerHTML = flow.steps.map((s) => `<li class="${s.state}"><span class="m">${M[s.state]}</span><span>${esc(s.label)}</span>${s.note ? `<span class="x">— ${esc(s.note)}</span>` : ''}</li>`).join('');
}

async function runFlow(flow) {
  const { name, mode } = flow;
  const d = DETAIL[name];
  const pm = pmOf(d);
  const verifyLabel = 'verify (lint · typecheck · test · build)';
  flow.steps = mode === 'install' ? [{ id:'install', label:`${pm} install`, state:'wait' }]
    : mode === 'verify' ? [{ id:'verify', label:verifyLabel, state:'wait' }]
    : [{ id:'apply', label:'파일 적용', state:'wait' }, { id:'install', label:`${pm} install`, state:'wait' }, { id:'verify', label:verifyLabel, state:'wait' }];
  const step = (id) => flow.steps.find((s) => s.id === id);
  const go = $('#dGo'); go.disabled = true; go.innerHTML = '<span class="spin"></span> 진행 중';
  setNote('');
  RUNNING.add(name); renderRow(name);
  paintSteps(flow);

  let failed = null;
  try {
    let needInstall = true, hasVerify = Boolean(d.scripts?.verify), hasPkg = d.hasPackageJson;
    if (mode === 'promote' || mode === 'sync') {
      const s = step('apply'); s.state = 'run'; paintSteps(flow);
      const res = await post('/api/apply', { repo: name, level: flow.level });
      s.state = 'ok'; s.note = `${res.written.length}개 파일 씀${res.removed?.length ? `, ${res.removed.length}개 삭제` : ''}`;
      // 적용 뒤의 실제 상태로 다음 단계를 정한다. 새로 읽기에 실패해도 적용 자체는 성공이다.
      let after = null;
      try { after = await getDetail(name); DETAIL[name] = after; syncListFrom(after); }
      catch (e) { s.note += ` · 새로고침 실패 (${e.message}) — 적용은 됐습니다`; }
      if (after) { hasPkg = after.hasPackageJson; hasVerify = Boolean(after.scripts?.verify); }
      needInstall = hasPkg && (res.written.includes('package.json') || Boolean(after?.deps?.needsInstall));
      const si = step('install');
      if (!hasPkg) { si.state = 'skip'; si.note = 'package.json 없음'; }
      else if (!needInstall) { si.state = 'skip'; si.note = '설치된 것이 이미 선언과 같음'; }
      paintSteps(flow);
    }
    if (step('install') && step('install').state === 'wait') {
      const ok = await runJob(flow, 'install');
      if (!ok) failed = 'install';
    }
    const sv = step('verify');
    if (sv && !failed) {
      if (!hasPkg) { sv.state = 'skip'; sv.note = 'package.json 없음'; }
      else if (!hasVerify) { sv.state = 'skip'; sv.note = 'verify 스크립트 없음 — L2에서 생깁니다'; }
      else if (!(await runJob(flow, 'verify'))) failed = 'verify';
    }
    paintSteps(flow);
  } catch (e) {
    const s = flow.steps.find((x) => x.state === 'run') || flow.steps[0];
    s.state = 'fail'; s.note = e.message; failed = s.id;
    paintSteps(flow);
  } finally {
    RUNNING.delete(name);
  }
  for (const s of flow.steps) if (s.state === 'wait') { s.state = 'skip'; s.note = '앞 단계가 실패해 건너뜀'; }
  paintSteps(flow);
  // 줄을 먼저 새로 고친 뒤 끝났다고 알린다 (안 그러면 잠깐 동안 줄이 '실행 중'으로 남는다)
  await refreshRepo(name);
  sortRows();
  if (FLOW === flow) {
    go.hidden = true;
    setNote(failed ? `${failed === 'apply' ? '적용' : failed} 에서 멈췄습니다` : '모두 끝났습니다', failed ? 'err' : 'ok');
  }
}

// /api/run 으로 시작하고 끝날 때까지 로그를 이어받는다. 실패하면 로그 끝부분을 보여준다.
async function runJob(flow, script) {
  const s = flow.steps.find((x) => x.id === script);
  s.state = 'run'; s.note = ''; paintSteps(flow);
  let job = await post('/api/run', { repo: flow.name, script });
  if (job.status === 'running' && job.script !== script) {
    s.state = 'fail'; s.note = `다른 작업(${job.script})이 실행 중입니다`; paintSteps(flow); return false;
  }
  const lines = [...(job.lines || [])];
  let since = job.nextIndex ?? lines.length;
  while (job.status === 'running') {
    await new Promise((r) => setTimeout(r, 700));
    job = await req(`/api/run?repo=${encodeURIComponent(flow.name)}&since=${since}`);
    if (!job) break;
    lines.push(...(job.lines || []));
    since = job.nextIndex ?? since;
    const last = [...lines].reverse().find((l) => l.trim());
    s.note = `${(job.durationMs / 1000).toFixed(0)}초${job.stage ? ` · ${job.stage}` : ''}${last ? ` · ${last.trim()}` : ''}`;
    paintSteps(flow);
  }
  const ok = job?.status === 'passed';
  s.state = ok ? 'ok' : 'fail';
  s.note = job ? `${(job.durationMs / 1000).toFixed(1)}초${!ok && job.exitCode != null ? ` · exit ${job.exitCode}` : ''}` : '';
  paintSteps(flow);
  if (!ok && FLOW === flow) {
    $('#dLog').innerHTML = `<div class="f" style="margin-top:10px">${esc(script)} 로그 마지막 40줄</div><pre class="log">${esc(lines.slice(-40).join('\n'))}</pre>`;
    const pre = $('#dLog pre'); pre.scrollTop = pre.scrollHeight;
  }
  return ok;
}

function stdTables() {

  const rows = [
    { name: 'Node', role: '런타임', ver: tc.node },
    { name: '패키지 매니저', role: '런타임', ver: tc.packageManager },

      .map(([name, ver]) => ({ name, role: PKG_ROLE[name] || '기타', ver })),

    <h3 id="d-faq">자주 겪는 상황</h3>
    <ul>
      <li><strong>미커밋이 수백 건으로 보입니다</strong> — 줄바꿈 차이일 가능성이 큽니다. 줄을 펼쳐 '줄바꿈 차이만 있는 파일' 표시를 확인하세요. L2가 <code>.gitattributes</code>로 해결합니다.</li>
      <li><strong>install이 frozen-lockfile로 실패합니다</strong> — 하네스는 <code>--no-frozen-lockfile</code>로 실행합니다. 그래도 실패하면 로그를 확인하세요.</li>
      <li><strong>버튼이 없습니다</strong> — '막힘'(머지 충돌 · 금지 의존성)이거나 '먼저 커밋'처럼 사람이 할 일이거나, 다음 레벨이 아직 구현되지 않은 경우입니다.</li>
      <li><strong>적용했는데 verify가 실패합니다</strong> — 설치가 실패하지 않았는지 먼저 보세요. 그 외에는 원래 있던 문제가 이제 드러난 것입니다.</li>
      <li><strong>하네스와 상관없는 폴더가 목록에 보입니다</strong> — 줄을 펼쳐 <strong>[이 폴더 제외]</strong>를 누르세요. 표 아래 '제외한 폴더'에서 다시 넣을 수 있습니다.</li>
      <li><strong>레포 목록이 비어 있습니다</strong> — 이 레포가 관리 대상들과 같은 폴더에 있어야 합니다. 부모 폴더를 워크스페이스로 봅니다.</li>
    </ul>`;
