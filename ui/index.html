<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kmjHarness 대시보드</title>
<style>
  :root {
    --bg:#faf9f7; --panel:#ffffff; --line:#e6e3dd; --ink:#1a1918; --sub:#6b6862; --faint:#9a968e;
    --accent:#c2410c; --err:#b91c1c; --warn:#a16207; --ok:#15803d; --info:#6b6862;
    --chip:#f2f0eb; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171614; --panel:#1f1e1b; --line:#33312d; --ink:#eceae6; --sub:#a5a19a; --faint:#6f6b64;
            --accent:#f97316; --err:#f87171; --warn:#fbbf24; --ok:#4ade80; --chip:#2a2825; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex:none; z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:-.01em; }
  header .path { font-family:var(--mono); font-size:11.5px; color:var(--faint); }
  .spacer { flex:1 }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:6px 12px; border-radius:7px; cursor:pointer; }
  button:hover { border-color:var(--faint); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  main { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:0; flex:1; min-height:0; }
  main > * { overflow-y:auto; min-height:0; }
  @media (max-width:820px){
    body { height:auto; overflow:visible; }
    main { grid-template-columns:1fr; flex:none; }
    main > * { overflow:visible; }
  }
  .list { border-right:1px solid var(--line); }
  .card { padding:13px 18px; border-bottom:1px solid var(--line); cursor:pointer; display:block; width:100%; text-align:left; border-radius:0; background:none; border-left:3px solid transparent; }
  .card:hover { background:var(--chip); }
  .card[aria-selected="true"] { background:var(--chip); border-left-color:var(--accent); }
  .card .row1 { display:flex; align-items:center; gap:8px; }
  .card .name { font-weight:600; }
  .card .meta { color:var(--sub); font-size:12px; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
  .lvl { font-family:var(--mono); font-size:11px; padding:1px 7px; border-radius:99px; background:var(--chip); border:1px solid var(--line); color:var(--sub); }
  .lvl.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .dots { margin-left:auto; display:flex; gap:5px; font-size:11.5px; font-family:var(--mono); }
  .e{color:var(--err)} .w{color:var(--warn)} .i{color:var(--faint)} .ok{color:var(--ok)}
  .detail { padding:22px 26px 60px; max-width:1000px; }
  .detail h2 { margin:0 0 2px; font-size:19px; letter-spacing:-.02em; }
  .detail .sub { color:var(--sub); font-size:12.5px; font-family:var(--mono); margin-bottom:20px; }
  .sec { margin:24px 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:650; }
  .finding { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .finding .bullet { flex:none; margin-top:5px; width:7px; height:7px; border-radius:99px; background:var(--info); }
  .finding.error .bullet{background:var(--err)} .finding.warn .bullet{background:var(--warn)}
  .finding .t { font-weight:550; }
  .finding .d { color:var(--sub); font-size:12.5px; margin-top:2px; }
  .finding .fix { color:var(--accent); font-size:12px; margin-top:3px; }
  .ladder { display:flex; flex-direction:column; gap:8px; }
  .step { display:flex; gap:12px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
  .step.current { border-color:var(--accent); }
  .step.done { opacity:.55; }
  .step.soonstep { opacity:.6; border-style:dashed; }
  .soon { font-size:11.5px; color:var(--faint); border:1px dashed var(--line); padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .step .n { font-family:var(--mono); font-weight:650; flex:none; width:26px; color:var(--sub); }
  .step .s { color:var(--sub); font-size:12.5px; margin-top:2px; }
  .step .act { margin-left:auto; flex:none; display:flex; align-items:center; gap:10px; }
  .step .more { background:none; border:0; color:var(--sub); font-size:12px; padding:2px 6px; cursor:pointer; }
  .step .more:hover { color:var(--ink); text-decoration:underline; }
  .lvdetail { padding:0 14px 12px 52px; border:1px solid var(--line); border-top:0; border-radius:0 0 9px 9px; margin-top:-8px; background:var(--panel); }
  .lvdetail p { margin:10px 0 8px; font-size:12.5px; color:var(--sub); line-height:1.65; }
  .lvdetail .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .lvdetail .cols { grid-template-columns:1fr; } }
  .lvdetail h5 { margin:6px 0 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .lvdetail ul { margin:0; padding-left:16px; font-size:12px; color:var(--sub); line-height:1.65; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); padding:0; width:min(880px,92vw); max-height:86vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg-h { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; position:sticky; top:0; background:var(--panel); }
  .dlg-b { padding:8px 20px 20px; overflow:auto; max-height:62vh; }
  .dlg-f { padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; position:sticky; bottom:0; background:var(--panel); }
  .act-row { border:1px solid var(--line); border-radius:8px; margin:10px 0; overflow:hidden; }
  .act-hd { display:flex; gap:10px; align-items:center; padding:9px 12px; cursor:pointer; background:var(--chip); }
  .tag { font-family:var(--mono); font-size:10.5px; padding:1px 7px; border-radius:5px; border:1px solid var(--line); }
  .tag.create{color:var(--ok)} .tag.update,.tag.merge{color:var(--warn)} .tag.skip{color:var(--faint)}
  .tag.delete{color:var(--err); border-color:color-mix(in srgb, var(--err) 45%, transparent)}
  .planwarn { background:color-mix(in srgb, var(--warn) 14%, transparent); border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);
              border-radius:8px; padding:11px 13px; font-size:12.5px; margin:12px 0 4px; }
  .planwarn strong { display:block; margin-bottom:3px; }
  .act-hd .rel { font-family:var(--mono); font-size:12.5px; }
  .act-hd .note { color:var(--sub); font-size:12px; margin-left:auto; }
  pre { margin:0; padding:12px; font-family:var(--mono); font-size:11.5px; line-height:1.5; overflow:auto; max-height:300px; background:var(--bg); border-top:1px solid var(--line); white-space:pre-wrap; word-break:break-all; }
  .empty { color:var(--faint); padding:60px 26px; text-align:center; }

  /* 로딩 표시 */
  #bar { position:fixed; top:0; left:0; right:0; height:2px; z-index:20; overflow:hidden; pointer-events:none; opacity:0; transition:opacity .18s; }
  #bar.on { opacity:1; }
  #bar::after { content:''; position:absolute; inset:0 auto 0 0; width:38%; background:var(--accent); border-radius:2px; animation:slide 1.05s ease-in-out infinite; }
  @keyframes slide { 0%{left:-38%} 60%{left:100%} 100%{left:100%} }
  .skel { padding:13px 18px; border-bottom:1px solid var(--line); }
  .skel span { display:block; height:11px; border-radius:4px; background:var(--chip); animation:pulse 1.3s ease-in-out infinite; }
  .skel span + span { margin-top:8px; height:9px; width:62%; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .spin { display:inline-block; width:11px; height:11px; margin-right:6px; vertical-align:-1px;
          border:2px solid currentColor; border-right-color:transparent; border-radius:99px; animation:rot .6s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg) } }
  .loading-note { color:var(--sub); padding:26px; text-align:center; font-size:13px; }

  /* verify 실행 */
  .runbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .badge { font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:99px; border:1px solid var(--line); }
  .badge.passed { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 45%, transparent); background:color-mix(in srgb, var(--ok) 12%, transparent); }
  .badge.failed { color:var(--err); border-color:color-mix(in srgb, var(--err) 45%, transparent); background:color-mix(in srgb, var(--err) 12%, transparent); }
  .badge.running { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .badge.error { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent); }
  .runmeta { color:var(--sub); font-size:12px; }
  .log { margin:0; padding:12px 14px; background:var(--ink); color:var(--bg); border-radius:9px;
         font-family:var(--mono); font-size:11.5px; line-height:1.55; max-height:340px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .log:empty { display:none; }
  .card .runmark { font-size:11px; font-weight:700; }

  /* 문서 다이얼로그 */
  dialog#doc { width:min(1040px,94vw); max-height:88vh; }
  .doc-wrap { display:grid; grid-template-columns:190px 1fr; min-height:0; }
  @media (max-width:760px){ .doc-wrap { grid-template-columns:1fr; } .doc-nav { display:none; } }
  .doc-nav { border-right:1px solid var(--line); padding:16px 10px 16px 18px; overflow-y:auto; max-height:72vh; }
  .doc-nav a { display:block; padding:6px 8px; border-radius:6px; color:var(--sub); text-decoration:none; font-size:12.5px; }
  .doc-nav a:hover { background:var(--chip); color:var(--ink); }
  .doc-body { padding:18px 26px 40px; overflow-y:auto; max-height:72vh; }
  .doc-body h3 { font-size:15px; margin:26px 0 8px; letter-spacing:-.01em; scroll-margin-top:12px; }
  .doc-body h3:first-child { margin-top:4px; }
  .doc-body p { margin:0 0 10px; color:var(--sub); font-size:13px; line-height:1.65; }
  .doc-body ul { margin:0 0 12px; padding-left:20px; color:var(--sub); font-size:13px; line-height:1.7; }
  .doc-body code { background:var(--chip); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:11.5px; }
  .doc-body strong { color:var(--ink); }
  .lvcard { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .lvcard .top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .lvcard .id { font-family:var(--mono); font-weight:700; color:var(--accent); }
  .lvcard .nm { font-weight:650; }
  .lvcard .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:10px; }
  @media (max-width:700px){ .lvcard .cols { grid-template-columns:1fr; } }
  .lvcard h5 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .risk { font-size:11px; font-weight:650; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .risk.none{color:var(--ok)} .risk.low{color:var(--ok)} .risk.medium{color:var(--warn)} .risk.high{color:var(--err)}
  .cmdrow { border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin:9px 0; }
  .cmdname code { font-size:12.5px; font-weight:650; background:none; padding:0; color:var(--ink); }
  .cmddesc { color:var(--sub); font-size:12.5px; margin:3px 0 7px; }
  .cmdex { margin:0; padding:9px 11px; background:var(--ink); color:var(--bg); border-radius:7px;
           font-family:var(--mono); font-size:11.5px; line-height:1.6; white-space:pre-wrap; }
  .doc-body h4 { color:var(--ink); }
  .note { border-left:3px solid var(--accent); padding:2px 0 2px 12px; margin:8px 0; font-size:12.5px; color:var(--sub); }

  /* 다음 할 일 */
  .steps { margin-bottom:22px; }
  .step2 { position:relative; display:flex; align-items:flex-start; gap:14px; padding:0 0 16px 0; }
  .step2:last-child { padding-bottom:0; }
  /* 단계를 잇는 세로선 — 순서가 눈에 보이게 한다 */
  .step2:not(:last-child)::before { content:''; position:absolute; left:12px; top:26px; bottom:2px; width:2px; background:var(--line); }
  .step2.done:not(:last-child)::before { background:color-mix(in srgb,var(--ok) 40%,var(--line)); }
  .step2 .num { position:relative; z-index:1; flex:none; width:26px; height:26px; border-radius:99px; display:grid; place-items:center;
                font-size:12px; font-weight:700; border:1px solid var(--line); background:var(--panel); color:var(--faint); }
  .step2.now .num { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent); }
  .step2.done .num { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 50%,transparent); background:color-mix(in srgb,var(--ok) 10%,transparent); }
  .step2 .body { flex:1; min-width:0; padding-top:2px; }
  .step2 .lbl { font-weight:650; }
  .step2.wait .lbl, .step2.blocked .lbl { color:var(--sub); font-weight:600; }
  .step2 .hint { color:var(--sub); font-size:12px; margin-top:2px; }
  .step2.now .hint { color:var(--accent); }
  .step2 .go { flex:none; margin-top:1px; }
  .step2.wait, .step2.blocked { opacity:.62; }

  /* 툴체인 표 */
  table.tc { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.tc th { text-align:left; font-weight:600; color:var(--faint); font-size:11px; text-transform:uppercase;
                letter-spacing:.06em; padding:0 10px 6px 0; border-bottom:1px solid var(--line); }
  table.tc td { padding:7px 10px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  table.tc td.v { font-family:var(--mono); font-size:11.5px; }
  table.tc td.g { color:var(--faint); font-size:11.5px; }
  .st { font-size:11px; font-weight:650; padding:2px 8px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; }
  .st.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .st.behind{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
  .st.missing{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
  .st.ahead,.st.extra,.st.unknown{color:var(--faint)}

  /* 도움말 */
  .help { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:0 0 18px; background:var(--panel); font-size:12.5px; }
  .help h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
  .help dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .help dt { font-weight:650; white-space:nowrap; }
  .help dd { margin:0; color:var(--sub); }
  .warnbar.err { background:color-mix(in srgb, var(--err) 13%, transparent); border-color:color-mix(in srgb, var(--err) 45%, transparent); }
  .warnbar { background:color-mix(in srgb, var(--warn) 14%, transparent); border:1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius:8px; padding:10px 13px; font-size:12.5px; margin-bottom:14px; }
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <h1>kmjHarness</h1>
  <span class="path" id="ws"></span>
  <span class="spacer"></span>
  <button onclick="openDoc()">설명</button>
  <button id="refresh" onclick="load()">새로고침</button>
</header>
<main>
  <div class="list" id="list">
    <div class="skel"><span></span><span></span></div>
    <div class="skel"><span></span><span></span></div>
    <div class="skel"><span></span><span></span></div>
    <div class="skel"><span></span><span></span></div>
  </div>
  <div id="detail" class="empty">레포를 읽는 중…</div>
</main>

<dialog id="doc">
  <div class="dlg-h"><strong>kmjHarness 안내</strong><span class="spacer"></span><button onclick="document.getElementById('doc').close()">닫기</button></div>
  <div class="doc-wrap">
    <nav class="doc-nav">
      <a href="#d-what">이게 뭔가</a>
      <a href="#d-rules">4가지 원칙</a>
      <a href="#d-std">표준 버전</a>
      <a href="#d-levels">편입 레벨 L0~L4</a>
      <a href="#d-order">작업 순서</a>
      <a href="#d-cmd">명령어</a>
      <a href="#d-own">파일 소유권</a>
      <a href="#d-terms">용어</a>
      <a href="#d-faq">자주 겪는 상황</a>
    </nav>
    <div class="doc-body" id="docBody"></div>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dlg-h"><strong id="dlgTitle"></strong><span class="spacer"></span><button onclick="dlg.close()">닫기</button></div>
  <div class="dlg-b" id="dlgBody"></div>
  <div class="dlg-f">
    <span id="dlgCount" style="color:var(--sub);font-size:12.5px"></span>
    <span class="spacer"></span>
    <button onclick="dlg.close()">취소</button>
    <button class="primary" id="dlgApply">적용</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let STATE = null, SELECTED = null;

// 진행 중인 요청 수를 세어 상단 바를 켜고 끈다. 요청이 겹쳐도 꼬이지 않는다.
let busy = 0;
async function req(url, opts) {
  busy++; $('#bar').classList.add('on');
  try { return await (await fetch(url, opts)).json(); }
  finally { if (--busy === 0) $('#bar').classList.remove('on'); }
}
const post = (url, body) => req(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function load() {
  const btn = $('#refresh');
  const label = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>읽는 중';
  try {
    STATE = await req('/api/state');
    $('#ws').textContent = STATE.workspaceRoot;
    renderList();
    if (SELECTED) { renderDetail(SELECTED); await hydrateRun(SELECTED); }
    else { $('#detail').className = 'empty'; $('#detail').textContent = '왼쪽에서 레포를 선택하세요.'; }
  } catch (e) {
    $('#detail').className = 'empty';
    $('#detail').textContent = '서버에 연결하지 못했습니다. 터미널에서 대시보드가 실행 중인지 확인하세요.';
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function renderList() {
  $('#list').innerHTML = STATE.repos.map((r) => {
    const s = r.diagnosis.summary;
    const dots = s.error||s.warn ? `<span class="e">${s.error}</span><span class="w">${s.warn}</span><span class="i">${s.info}</span>`
                                 : `<span class="ok">이상 없음</span>`;
    return `<button class="card" aria-selected="${SELECTED===r.name}" onclick="select('${r.name}')">
      <div class="row1">
        <span class="name">${esc(r.name)}</span>
        <span class="lvl ${r.level!=null?'on':''}">${r.level==null?'미편입':'L'+r.level}</span>
        <span class="dots">${dots}</span>
      </div>
      <div class="meta">
        <span>${esc(r.detectedProfile)}${r.detectedAddons.length?' +'+r.detectedAddons.join(','):''}</span>
        <span>${esc(r.packageManager)}</span>
        <span>${esc(r.branch||'—')}</span>
        ${r.git?.inMerge?`<span class="e">충돌 ${r.git.conflicted}</span>`:''}
        ${!r.git?.inMerge&&r.git?.dirty?`<span class="w">미커밋 ${r.git.dirty}</span>`:''}
        ${r.git?.eolNoise?`<span class="i">줄바꿈 ${r.git.eolNoise}</span>`:''}
        ${runMark(r.name)}
      </div></button>`;
  }).join('');
}

function select(name) {
  SELECTED = name;
  stopPoll();
  renderList();
  renderDetail(name);
  hydrateRun(name);     // 이미 돌고 있거나 끝난 실행이 있으면 이어서 보여준다
}



// 표준 버전 표 — toolchain.json 에서 그대로 만든다. 코드를 고치면 문서도 같이 바뀐다.
const PKG_ROLE = {
  react:'프레임워크', 'react-dom':'프레임워크', 'react-router-dom':'라우팅', zustand:'상태',

  eslint:'린트', 'typescript-eslint':'린트', '@eslint/js':'린트', globals:'린트',
  'eslint-plugin-react-hooks':'린트', 'eslint-plugin-react-refresh':'린트',
  'eslint-config-prettier':'린트', prettier:'포맷', vitest:'테스트',
};
const ROLE_ORDER = ['런타임','프레임워크','라우팅','상태','스타일','빌드','언어','린트','포맷','테스트'];

  ['build', '프로덕션 빌드'],
  ['preview', '빌드 결과 확인'],
  ['lint / lint:fix', '정적 검사 · 자동 수정'],
  ['format / format:check', '포맷 적용 · 검사'],
  ['typecheck', '타입 검사'],
  ['test', '테스트 1회 실행 (watch 아님)'],
  ['test:watch / test:coverage', '감시 모드 · 커버리지'],
  ['verify', 'lint → typecheck → test → build 를 한 번에'],

function stdTables() {
  const tc = STATE?.toolchain;
  if (!tc) return '<p>툴체인 정보를 불러오지 못했습니다.</p>';
  const rows = [
    { name: 'Node', role: '런타임', ver: tc.node },
    { name: '패키지 매니저', role: '런타임', ver: tc.packageManager },
    ...Object.entries({ ...(tc.versions || {}), ...((tc.lintToolchain || {}).add || {}) })
      .map(([name, ver]) => ({ name, role: PKG_ROLE[name] || '기타', ver })),
  ].sort((a, b) => {
    const d = ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role);
    return d !== 0 ? d : a.name.localeCompare(b.name);
  });

  const removed = (tc.lintToolchain || {}).remove || [];

  return `
    <table class="tc" style="margin-bottom:14px">
      <thead><tr><th>항목</th><th>역할</th><th>표준 버전</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><strong>${esc(r.name)}</strong></td>
        <td class="g">${esc(r.role)}</td>
        <td class="v">${esc(r.ver)}</td></tr>`).join('')}
      </tbody>
    </table>
    ${removed.length ? `<div class="note"><strong>제거 대상</strong> — ${removed.map(esc).join(' · ')}
      (L3에서 <code>typescript-eslint</code> 통합 패키지로 대체됩니다)</div>` : ''}

    <h4 style="font-size:13px;margin:20px 0 6px">스크립트 계약</h4>
    <p>스택이 무엇이든 모든 레포가 <strong>같은 이름</strong>의 스크립트를 갖습니다. 내용만 스택별로 다릅니다.</p>
    <table class="tc">
      <thead><tr><th>스크립트</th><th>하는 일</th></tr></thead>
      <tbody>${SCRIPT_DOC.map(([n, d]) => `<tr>
        <td class="v"><strong>${esc(n)}</strong></td><td class="g">${esc(d)}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="note">이 표준은 <code>kmjHarness/toolchain.json</code> 한 곳에서 관리됩니다.
      거기를 고치면 모든 레포의 진단·계획이 그 기준으로 바뀝니다.</div>`;
}

const STEP_MARK = { done:'✓', now:'▸', wait:'·', blocked:'×' };

function stepsBox(r) {
  const steps = r.steps || [];
  if (!steps.length) return '';
  const cur = r.level ?? -1;
  const nextId = cur + 1;
  return `<div class="steps">${steps.map((s, i) => {
    let go = '';
    if (s.state === 'now') {
      if (s.id === 'install') go = `<button class="primary go" onclick="runTask('${r.name}','install')">${r.packageManager==='none'?'npm':esc(r.packageManager)} install</button>`;
      else if (s.id === 'verify') go = `<button class="primary go" onclick="runTask('${r.name}','verify')">verify 실행</button>`;
      else if (s.id === 'promote') go = `<button class="primary go" onclick="preview('${r.name}',${nextId},this)">승급</button>`;
      else if (s.id === 'sync') go = `<button class="primary go" onclick="preview('${r.name}',${cur},this)">재적용</button>`;
    }
    return `<div class="step2 ${s.state}">
      <div class="num">${s.state === 'done' ? '✓' : s.state === 'blocked' ? '×' : (i + 1)}</div>
      <div class="body">
        <div class="lbl">${esc(s.label)}</div>
        <div class="hint">${esc(s.hint || '')}</div>
      </div>
      ${go}
    </div>`;
  }).join('')}</div>`;
}

const ST_KO = { ok:'일치', behind:'뒤처짐', ahead:'앞섬', missing:'없음', extra:'표준 미정', unknown:'판별 불가' };

function tcTable(r) {
  const rows = r.toolchain || [];
  if (!rows.length) return '<div class="runmeta">비교할 항목이 없습니다.</div>';
  const body = rows.map((x) => `<tr>
      <td><strong>${esc(x.name)}</strong></td>
      <td class="g">${esc(x.group)}</td>
      <td class="v">${esc(x.current ?? '—')}</td>
      <td class="v">${esc(x.standard ?? '—')}</td>
      <td><span class="st ${x.status}">${ST_KO[x.status] || x.status}</span></td>
    </tr>`).join('');
  const off = rows.filter((x) => x.status === 'behind' || x.status === 'missing').length;
  return `<table class="tc">
    <thead><tr><th>패키지</th><th>역할</th><th>현재</th><th>표준</th><th>상태</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="runmeta" style="margin-top:8px">${off ? `${off}개 항목이 표준과 다릅니다 — L4에서 맞춥니다.` : '모두 표준과 일치합니다.'}</div>`;
}

// ── 실행 (install / verify) ───────────────────────────────────
let pollTimer = null, logIndex = 0;
const canRun = (r) => Boolean(r.scripts && r.scripts.verify);
const STATUS_KO = { running:'실행 중', passed:'통과', failed:'실패', error:'오류' };

function runMark(name) {
  const j = STATE?.runs?.[name];
  if (!j) return '';
  const w = j.script === 'install' ? '설치' : 'verify';
  if (j.status === 'running') return `<span class="runmark" style="color:var(--accent)">${w} 실행 중</span>`;
  if (j.status === 'passed') return `<span class="runmark ok">${w} ${j.script === 'install' ? '완료' : '통과'}</span>`;
  if (j.status === 'failed') return `<span class="runmark e">${w} 실패</span>`;
  return '';
}

function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } logIndex = 0; }

function paintRun(job) {
  const badge = $('#runBadge'), meta = $('#runMeta'), log = $('#runLog'), btn = $('#runBtn');
  if (!badge || !job) return;
  badge.innerHTML = `<span class="badge ${job.status}">${job.status==='running'?'<span class="spin"></span>':''}${STATUS_KO[job.status]||job.status}</span>`;
  const secs = (job.durationMs/1000).toFixed(1);
  const what = job.script === 'install' ? '설치' : 'verify';
  meta.textContent = job.status === 'running'
    ? `${what} · ${secs}초 경과${job.stage?` · ${job.stage} 단계`:''}`
    : `${what} · ${secs}초${job.stage?` · 마지막 단계 ${job.stage}`:''}${job.exitCode!=null?` · exit ${job.exitCode}`:''}`;
  if (job.lines?.length) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.textContent += (log.textContent ? '\n' : '') + job.lines.join('\n');
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  logIndex = job.nextIndex ?? logIndex;
  const inst = $('#installBtn');
  const running = job.status === 'running';
  if (btn) {
    btn.disabled = running;
    btn.innerHTML = running && job.script === 'verify' ? '<span class="spin"></span>실행 중' : 'verify 다시 실행';
  }
  if (inst) {
    inst.disabled = running;
    if (running && job.script === 'install') inst.innerHTML = '<span class="spin"></span>설치 중';
  }
}

async function hydrateRun(name) {
  let job;
  try { job = await fetch(`/api/run?repo=${encodeURIComponent(name)}&since=0`).then((r) => r.json()); }
  catch { return; }
  if (!job || SELECTED !== name || !$('#runLog')) return;
  $('#runLog').textContent = '';
  logIndex = 0;
  paintRun(job);
  if (job.status === 'running' && !pollTimer) startPoll(name);
}

function startPoll(name) {
  stopPollTimerOnly();
  pollTimer = setInterval(async () => {
    if (SELECTED !== name) return stopPoll();
    let job;
    try { job = await fetch(`/api/run?repo=${encodeURIComponent(name)}&since=${logIndex}`).then((r) => r.json()); }
    catch { return; }
    if (!job) return;
    paintRun(job);
    if (job.status !== 'running') {
      stopPollTimerOnly();
      const result = job.status, what = job.script === 'install' ? '설치' : 'verify';
      await load();                       // 카드 배지·진단 갱신 + 실행 로그 복원
      toast(`${name} ${what} ${result === 'passed' ? '완료' : '실패'}`);
    }
  }, 700);
}
function stopPollTimerOnly() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function runTask(name, script) {
  $('#runLog').textContent = '';
  logIndex = 0;
  const job = await post('/api/run', { repo: name, script });
  paintRun(job);
  if (job.status === 'running') startPoll(name);
  else { await load(); }
}

function gitBar(r) {
  const g = r.git || {};
  if (g.inMerge) return `<div class="warnbar err">이 레포는 <strong>병합이 끝나지 않은 상태</strong>입니다 — 충돌 ${g.conflicted}개.
    충돌을 해결하고 커밋하기 전에는 하네스를 적용할 수 없습니다. <code>git status</code>로 확인하세요.</div>`;
  const bits = [];
  if (g.dirty) bits.push(`미커밋 ${g.dirty}건${g.summary ? ' (' + esc(g.summary.trim()) + ')' : ''}`);
  if (g.eolNoise) bits.push(`줄바꿈 차이만 있는 파일 ${g.eolNoise}개 — 실제 변경 아님`);
  if (!bits.length) return '';
  return `<div class="warnbar">${bits.join('<br>')}</div>`;
}

function renderDetail(name) {
  const r = STATE.repos.find((x) => x.name === name);
  const cur = r.level ?? -1;
  const blocked = Boolean(r.git?.inMerge);   // 머지 충돌 중에는 적용을 막는다
  const findings = r.diagnosis.findings.map((f) => `
    <div class="finding ${f.severity}"><div class="bullet"></div><div>
      <div class="t">${esc(f.title)}</div>
      ${f.detail?`<div class="d">${esc(f.detail)}</div>`:''}
      ${f.fix?`<div class="fix">→ ${esc(f.fix)}</div>`:''}
    </div></div>`).join('') || '<div style="color:var(--ok);padding:8px 0">이상 없음</div>';

  const ladder = STATE.levels.map((l) => {
    const done = cur >= l.id, next = l.id === cur + 1;
    const soon = l.implemented === false;
    const detId = `lv${l.id}`;
    return `<div class="step ${done?'done':''} ${next&&!soon?'current':''} ${soon?'soonstep':''}">
      <div class="n">L${l.id}</div>
      <div style="flex:1;min-width:0">
        <div><strong>${esc(l.name.replace(/^L\d+\s/,''))}</strong>
          <span class="risk ${l.risk}" style="margin-left:8px">${RISK_KO[l.risk]||l.risk}</span></div>
        <div class="s">${esc(l.summary)}</div>
      </div>
      <div class="act">
        <button class="more" onclick="const d=document.getElementById('${detId}');d.hidden=!d.hidden;this.textContent=d.hidden?'자세히':'접기'">자세히</button>
        ${
          done ? '<span style="color:var(--ok);font-size:12px">완료</span>'
          : soon ? '<span class="soon">준비 중</span>'
          : `<button class="${next&&!blocked?'primary':''}" ${next&&!blocked?'':'disabled'} onclick="preview('${r.name}',${l.id},this)">${l.id===0?'편입':'승급'}</button>`
        }
      </div>
    </div>
    <div class="lvdetail" id="${detId}" hidden>
      <p>${esc(l.detail || l.summary)}</p>
      <div class="cols">
        <div><h5>바꾸는 것</h5><ul>${(l.writes||[]).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
        <div><h5>그대로 두는 것</h5><ul>${(l.keeps||[]).map(w=>`<li>${esc(w)}</li>`).join('')||'<li>—</li>'}</ul></div>
      </div>
      ${l.after ? `<div class="note"><strong>적용 후</strong> — ${esc(l.after)}</div>` : ''}
      ${l.revert ? `<div class="note"><strong>되돌리기</strong> — ${esc(l.revert)}</div>` : ''}
    </div>`;
  }).join('');

  $('#detail').className = 'detail';
  $('#detail').innerHTML = `
    <h2>${esc(r.name)}</h2>
    <div class="sub">${esc(r.detectedProfile)}${r.detectedAddons.length?' +'+r.detectedAddons.join(','):''} · ${esc(r.packageManager)} · ${esc(r.branch||'—')} · ${esc(r.handshake.label)}</div>
    ${gitBar(r)}
    <div class="sec">다음 할 일</div>
    ${stepsBox(r)}
    <div class="sec">편입 단계</div><div class="ladder">${ladder}</div>
    <div class="sec">검증</div>
    <div class="runbar">
      <button id="installBtn" onclick="runTask('${r.name}','install')">${r.packageManager==='none'?'npm':esc(r.packageManager)} install</button>
      <button id="runBtn" class="${canRun(r)?'primary':''}" ${canRun(r)?'':'disabled'} onclick="runTask('${r.name}','verify')">verify 실행</button>
      <span id="runBadge"></span>
      <span id="runMeta" class="runmeta">${canRun(r)?'':'verify 스크립트가 없습니다 — L2로 승급하면 생성됩니다.'}</span>
    </div>
    <pre class="log" id="runLog"></pre>

    <div class="sec">툴체인</div>
    ${tcTable(r)}

    <div class="sec">진단 ${r.diagnosis.summary.error} error · ${r.diagnosis.summary.warn} warn · ${r.diagnosis.summary.info} info</div>
    ${findings}`;
}

async function preview(name, level, btn) {
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>계산 중'; }
  $('#dlgTitle').textContent = `${name} → L${level} 미리보기`;
  $('#dlgCount').textContent = '';
  $('#dlgApply').disabled = true;
  $('#dlgBody').innerHTML = '<div class="loading-note"><span class="spin"></span>변경 계획을 계산하는 중…</div>';
  dlg.showModal();

  let plan;
  try {
    plan = await post('/api/plan', { repo: name, level });
  } catch {
    $('#dlgBody').innerHTML = '<div class="loading-note">계획을 가져오지 못했습니다.</div>';
    return;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = level === 0 ? '편입' : '승급'; }
  }

  if (plan.unavailable) {
    $('#dlgBody').innerHTML = `<div class="loading-note">${esc(plan.reason)}</div>`;
    $('#dlgCount').textContent = '';
    $('#dlgApply').disabled = true;
    return;
  }
  $('#dlgCount').textContent = plan.changed === 0
    ? '바뀔 파일이 없습니다 (이미 적용된 상태)'
    : `${plan.changed}개 파일 변경 예정`;
  const warnHtml = (plan.warnings || []).length
    ? `<div class="planwarn"><strong>적용 후 할 일</strong>${plan.warnings.map((w) => esc(w)).join('<br>')}</div>`
    : '';
  $('#dlgBody').innerHTML = warnHtml + plan.actions.map((a, i) => `
    <div class="act-row">
      <div class="act-hd" onclick="document.getElementById('p${i}').hidden=!document.getElementById('p${i}').hidden">
        <span class="tag ${a.kind}">${a.kind}</span><span class="rel">${esc(a.rel)}</span><span class="note">${esc(a.note||'')}</span>
      </div>
      <pre id="p${i}" hidden>${a.remove ? '이 파일이 삭제됩니다. 현재 내용:\n\n' + esc(a.before ?? '') : esc(a.after ?? '(변경 없음)')}</pre>
    </div>`).join('');
  $('#dlgApply').disabled = plan.changed === 0;
  $('#dlgApply').onclick = async () => {
    const a = $('#dlgApply');
    a.disabled = true; a.innerHTML = '<span class="spin"></span>적용 중';
    try {
      await post('/api/apply', { repo: name, level });
      dlg.close();
      await load();
      toast(`${name} → L${level} 적용 완료`);
    } catch {
      $('#dlgBody').insertAdjacentHTML('afterbegin', '<div class="loading-note">적용에 실패했습니다.</div>');
    } finally {
      a.disabled = false; a.textContent = '적용';
    }
  };
}

// 적용 후 짧게 뜨는 확인 메시지
function toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
load();
</script>
